<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0xBeta build status</title>
<style>
body{margin:0;background:#101012;color:#f2f2f2;font:14px/1.4 ui-monospace,Menlo,"DejaVu Sans Mono",monospace;display:flex;justify-content:center;padding:18px}
.c{width:100%;max-width:460px;background:#1c1c1e;border-radius:18px;padding:18px 22px 14px}
h1{font-size:15px;margin:0 0 12px}.r{margin:0 0 13px}.l{display:flex;justify-content:space-between;gap:10px}.l b{font-size:14px}.l span{color:#cfcff8;white-space:nowrap}
.t{height:11px;background:#4f4f78;border-radius:6px;margin:5px 0 4px;overflow:hidden}.t i{display:block;height:100%;border-radius:6px;transition:width .6s}
.n{color:#9a9aa6;font-size:12px}.f{color:#77778a;font-size:11.5px;margin-top:4px}
</style></head><body><div class="c"><h1 id="h">Loading…</h1><div id="rows"></div><div class="f" id="f"></div></div>
<script>
// Reads status/status.json from the public repo every 20 s. Text only (textContent), never markup. ?ref=<branch> picks another branch.
var REF=new URLSearchParams(location.search).get('ref')||'claude/vibrant-mccarthy-dart0b';
var URL_='https://raw.githubusercontent.com/AloZic80/ev-bet-screener/'+encodeURIComponent(REF).replace(/%2F/g,'/')+'/status/status.json';
function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
function frac(i){ return +i.total>0?Math.max(0,Math.min(1,(+i.done||0)/+i.total)):(i.state==='done'?1:0); }
function fill(i){ return i.state==='done'?'#7fe0a4':i.state==='failed'?'#ff7b7b':'#b0b0f8'; }
function right(i){ return +i.total>0?Math.round(frac(i)*100)+'% done':(i.state==='done'?'done':i.state==='failed'?'failed':i.state==='working'?'working':'waiting'); }
function paint(j){ document.getElementById('h').textContent=j.headline||'Builds'; var R=document.getElementById('rows'); R.textContent='';
  (j.items||[]).forEach(function(i){ var r=el('div','r'), l=el('div','l'); l.appendChild(el('b',null,i.name)); l.appendChild(el('span',null,right(i))); r.appendChild(l);
    var t=el('div','t'), b=el('i'); b.style.width=(frac(i)*100).toFixed(1)+'%'; b.style.background=fill(i); t.appendChild(b); r.appendChild(t);
    r.appendChild(el('div','n',(+i.total>0?(i.done||0)+' / '+i.total+' · ':'')+(i.note||i.state))); R.appendChild(r); });
  document.getElementById('f').textContent='Updated '+(j.updated||'unknown')+' · refreshes every 20 s'; }
function load(){ fetch(URL_+'?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(paint).catch(function(){ document.getElementById('f').textContent='Can not read the status right now. Trying again in 20 s.'; }); }
load(); setInterval(load,20000);
</script></body></html>
